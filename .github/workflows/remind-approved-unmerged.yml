name: Remind Approved But Unmerged PRs

on:
  schedule:
    - cron: "0 23 * * *" # 평일 오전 8시
  workflow_dispatch: # 수동 실행도 가능

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Find approved but unmerged PRs and notify Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        with:
          script: |
            const STALE_HOURS = 0;
            const now = new Date();

            if (!process.env.DISCORD_WEBHOOK_URL) {
              throw new Error('DISCORD_WEBHOOK_URL secret이 설정되지 않았습니다.');
            }

            if (!process.env.DISCORD_USER_MAP) {
              throw new Error('DISCORD_USER_MAP secret이 설정되지 않았습니다.');
            }

            let DISCORD_MAP;
            try {
              DISCORD_MAP = JSON.parse(process.env.DISCORD_USER_MAP);
            } catch (e) {
              throw new Error(`DISCORD_USER_MAP JSON 파싱 실패: ${e.message}`);
            }

            // open 상태의 모든 PR 조회
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const approvedPRs = [];

            for (const pr of pullRequests) {
              // Draft PR 제외
              if (pr.draft) continue;

              // 리뷰 목록 조회
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

              // 리뷰어별 최신 리뷰만 추출
              const latestReviewByUser = {};
              for (const review of reviews) {
                latestReviewByUser[review.user.login] = review;
              }

              const hasApproval = Object.values(latestReviewByUser).some(
                r => r.state === 'APPROVED'
              );
              if (!hasApproval) continue;

              // CHANGES_REQUESTED 남아있으면 제외
              const hasChangesRequested = Object.values(latestReviewByUser).some(
                r => r.state === 'CHANGES_REQUESTED'
              );
              if (hasChangesRequested) continue;

              // 마지막 승인 시각 기준 경과 시간
              const approvedReviews = Object.values(latestReviewByUser).filter(
                r => r.state === 'APPROVED'
              );
              const lastApprovedAt = new Date(
                Math.max(...approvedReviews.map(r => new Date(r.submitted_at)))
              );
              const elapsedHours = (now - lastApprovedAt) / (1000 * 60 * 60);
              if (elapsedHours < STALE_HOURS) continue;

              const author = pr.user.login;
              const approvers = approvedReviews.map(r => r.user.login);

              // PR 작성자 멘션 (본인 PR이니까 작성자만)
              const authorMention = DISCORD_MAP[author]
                ? `<@${DISCORD_MAP[author]}>`
                : `\`${author}\``;

              approvedPRs.push({
                title: pr.title,
                url: pr.html_url,
                author,
                authorMention,
                approvers,
                elapsedHours: Math.floor(elapsedHours),
              });
            }

            if (approvedPRs.length === 0) {
              console.log('머지 대기 중인 PR이 없습니다.');
              return;
            }

            // Discord Embed 메시지 구성
            const fields = approvedPRs.map(pr => ({
              name: `✅ ${pr.title}`,
              value: [
                `👤 작성자: \`${pr.author}\``,
                `👍 승인자: ${pr.approvers.map(a => `\`${a}\``).join(', ')}`,
                `🔗 [PR 바로가기](${pr.url})`,
              ].join('\n'),
              inline: false,
            }));

            const payload = {
              content: approvedPRs.map(pr => pr.authorMention).join(' '), // 작성자 멘션
              embeds: [
                {
                  title: `🚀 머지 대기 중인 PR ${approvedPRs.length}개`,
                  description: `승인받은 지 24시간 이상 지났지만 아직 머지되지 않은 PR입니다.`,
                  color: 0xEB459E,
                  fields,
                  footer: {
                    text: `${context.repo.owner}/${context.repo.repo}`,
                  },
                  timestamp: now.toISOString(),
                },
              ],
            };

            // Discord Webhook 전송
            const response = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              throw new Error(`Discord 전송 실패: ${response.status} ${response.statusText}`);
            }

            console.log(`Discord 알림 전송 완료 (${approvedPRs.length}개 PR)`);
