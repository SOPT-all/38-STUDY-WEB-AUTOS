name: Remind Unreviewed PRs

on:
  schedule:
    - cron: '0 23 * * *'  # 평일 오전 8시 KST
  workflow_dispatch:        # 수동 실행도 가능

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Find unreviewed PRs and notify Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        with:
          script: |
            const STALE_HOURS = 0;
            const now = new Date();

            // GitHub 유저명 → Discord 유저 ID 매핑 (Secret에서 로드)
            const DISCORD_MAP = JSON.parse(process.env.DISCORD_USER_MAP);

            // 전체 팀원 (PR 작성자 제외하고 미리뷰어 계산용)
            const ALL_MEMBERS = Object.keys(DISCORD_MAP);

            // open 상태의 모든 PR 조회
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 25,
            });

            const stalePRs = [];

            for (const pr of pullRequests) {
              // Draft PR 제외
              if (pr.draft) continue;

              const createdAt = new Date(pr.created_at);
              const elapsedHours = (now - createdAt) / (1000 * 60 * 60);

              // 24시간 미만이면 스킵
              if (elapsedHours < STALE_HOURS) continue;

              // 리뷰 목록 조회
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

              const author = pr.user.login;

              // 승인 2명 이상이면 스킵 (컨벤션에 따라 승인 인원 조정 가능)
              const approvalCount = reviews.filter(r => r.state === 'APPROVED').length;
              if (approvalCount >= 2) continue;

              // 이미 리뷰한 사람 목록
              const reviewedUsers = reviews
                .filter(r => ['APPROVED', 'CHANGES_REQUESTED'].includes(r.state))
                .map(r => r.user.login);
              
              // 본인 제외 + 이미 리뷰한 사람 제외 → 아직 리뷰 안 한 사람만 멘션
              const nonReviewers = ALL_MEMBERS.filter(
                member => member !== author && !reviewedUsers.includes(member)
              );

              // 멘션할 사람이 없으면 스킵 (모두 리뷰 완료)
              if (nonReviewers.length === 0) continue;

              const mentions = nonReviewers
                .map(member => `<@${DISCORD_MAP[member]}>`)
                .join(' ');

              stalePRs.push({
                title: pr.title,
                url: pr.html_url,
                author,
                elapsedHours: Math.floor(elapsedHours),
                mentions,
              });
            }

            if (stalePRs.length === 0) {
              console.log('리뷰 대기 중인 PR이 없습니다.');
              return;
            }

            // Discord Embed 메시지 구성
            const fields = stalePRs.map(pr => ({
              name: `📌 ${pr.title}`,
              value: [
                `👤 작성자: \`${pr.author}\``,
                `🔗 [PR 바로가기](${pr.url})`,
                `👀 리뷰 요청: ${pr.mentions}`,
              ].join('\n'),
              inline: false,
            }));

            const payload = {
              content: stalePRs.map(pr => pr.mentions).join(' '), // 멘션은 embed 밖에 있어야 실제로 울림
              embeds: [
                {
                  title: `🔔 리뷰 대기 중인 PR ${stalePRs.length}개`,
                  description: `**24시간 이상** 리뷰가 달리지 않은 PR입니다.`,
                  color: 0xF0A500,
                  fields,
                  footer: {
                    text: `${context.repo.owner}/${context.repo.repo}`,
                  },
                  timestamp: now.toISOString(),
                },
              ],
            };

            // Discord Webhook 전송
            const response = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              throw new Error(`Discord 전송 실패: ${response.status} ${response.statusText}`);
            }

            console.log(`Discord 알림 전송 완료 (${stalePRs.length}개 PR)`);