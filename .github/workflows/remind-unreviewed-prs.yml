name: Remind Unreviewed PRs

on:
  schedule:
    - cron: "0 23 * * 0-4" 
  workflow_dispatch: 

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Find unreviewed PRs and notify Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_MAP: ${{ secrets.DISCORD_USER_MAP }}
        with:
          script: |
            const STALE_HOURS = 24;
            const now = new Date();

            if (!process.env.DISCORD_WEBHOOK_URL) {
              throw new Error('DISCORD_WEBHOOK_URL secret이 설정되지 않았습니다.');
            }

            if (!process.env.DISCORD_USER_MAP) {
              throw new Error('DISCORD_USER_MAP secret이 설정되지 않았습니다.');
            }

            let DISCORD_MAP;
            try {
              DISCORD_MAP = JSON.parse(process.env.DISCORD_USER_MAP);
            } catch (e) {
              throw new Error(`DISCORD_USER_MAP JSON 파싱 실패: ${e.message}`);
            }

            const ALL_MEMBERS = Object.keys(DISCORD_MAP);

            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            const stalePRs = [];

            for (const pr of pullRequests) {
              if (pr.draft) continue;

              const createdAt = new Date(pr.created_at);
              const elapsedHours = (now - createdAt) / (1000 * 60 * 60);

              if (elapsedHours < STALE_HOURS) continue;

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

              const author = pr.user.login;

              const approvalCount = reviews.filter(r => r.state === 'APPROVED').length;
              if (approvalCount >= 2) continue;

              const reviewedUsers = reviews
                .filter(r => ['APPROVED', 'CHANGES_REQUESTED'].includes(r.state))
                .map(r => r.user.login);
              
              const nonReviewers = ALL_MEMBERS.filter(
                member => member !== author && !reviewedUsers.includes(member)
              );

              if (nonReviewers.length === 0) continue;

              const mentions = nonReviewers
                .map(member => `<@${DISCORD_MAP[member]}>`)
                .join(' ');

              stalePRs.push({
                title: pr.title,
                url: pr.html_url,
                author,
                elapsedHours: Math.floor(elapsedHours),
                mentions,
                nonReviewers,
              });
            }

            if (stalePRs.length === 0) {
              console.log('리뷰 대기 중인 PR이 없습니다.');
              return;
            }

            const fields = stalePRs.map(pr => ({
              name: `📌 ${pr.title}`,
              value: [
                `👤 작성자: \`${pr.author}\``,
                `⏱ 경과 시간: ${pr.elapsedHours}시간`,
                `🔗 [PR 바로가기](${pr.url})`,
                `👀 리뷰 요청: ${pr.mentions}`,
              ].join('\n'),
              inline: false,
            }));

            const allMentions = [...new Set(stalePRs.flatMap(pr => pr.nonReviewers).map(member => `<@${DISCORD_MAP[member]}>`))].join(' ');

            const CHUNK_SIZE = 25;
            const chunks = [];
            for (let i = 0; i < fields.length; i += CHUNK_SIZE) {
              chunks.push(fields.slice(i, i + CHUNK_SIZE));
            }

            for (let i = 0; i < chunks.length; i++) {
              const isFirst = i === 0;
              const total = chunks.length;

              const payload = {
                content: isFirst ? allMentions : undefined,
                embeds: [
                  {
                    title: total > 1
                      ? `🔔 리뷰 대기 중인 PR ${stalePRs.length}개 (${i + 1}/${total})`
                      : `🔔 리뷰 대기 중인 PR ${stalePRs.length}개`,
                    description: isFirst ? `**24시간 이상** 리뷰가 달리지 않은 PR입니다.` : undefined,
                    color: 0xF0A500,
                    fields: chunks[i],
                    footer: { text: `${context.repo.owner}/${context.repo.repo}` },
                    timestamp: now.toISOString(),
                  },
                ],
              };

              const response = await fetch(process.env.DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              });

              if (!response.ok) {
                throw new Error(`Discord 전송 실패 (${i + 1}번째): ${response.status} ${response.statusText}`);
              }

              if (i < chunks.length - 1) {
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
            }

            console.log(`Discord 알림 전송 완료 (${stalePRs.length}개 PR, ${chunks.length}번 전송)`);
